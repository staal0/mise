services:
  mise:
    image: ghcr.io/staal0/mise:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - recipes:/recipes
    healthcheck:
      test: ["CMD", "/mise", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
    # For a host folder instead, run as its owner (`id -u`:`id -g`):
    #   user: "1000:1000"
    #   volumes:
    #     - ./recipes:/recipes

volumes:
  recipes:
