{{define "head"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥄</text></svg>">
</head>
<body>
<header class="top">
  <a href="/" class="brand">Mise en place</a>
  <div class="prefs">
    <button type="button" id="lang" class="pref-btn" data-next="{{.NextLang}}" title="{{.T.langTitle}}">🌐 {{.T.langName}}</button>
    <button type="button" id="theme" class="pref-btn" title="{{.T.themeTitle}}">◐ {{.T.themeAuto}}</button>
  </div>
</header>
<main>
{{end}}

{{define "foot"}}
</main>
<footer class="site-foot">
  mise {{with versionURL}}<a href="{{.}}" target="_blank" rel="noopener noreferrer">{{versionLabel}}</a>{{else}}{{versionLabel}}{{end}}
</footer>
<script>window.T = {{.T}};</script>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
